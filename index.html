<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Document Analyzer · Avvio</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; color: #172033; background: #f5f8fc; }
      body::before, body::after { content: ""; position: fixed; width: 42rem; height: 42rem; border-radius: 50%; filter: blur(2px); opacity: .55; pointer-events: none; }
      body::before { top: -24rem; left: -18rem; background: #d6edff; }
      body::after { right: -22rem; bottom: -27rem; background: #dce8ff; }
      main { position: relative; width: min(31rem, calc(100vw - 2.5rem)); padding: 3rem 2.5rem; text-align: center; background: rgba(255,255,255,.86); border: 1px solid #dbe5f0; border-radius: 1.5rem; box-shadow: 0 22px 65px rgba(39, 70, 110, .13); backdrop-filter: blur(12px); }
      .mark { display: inline-flex; align-items: center; justify-content: center; width: 3.75rem; height: 3.75rem; margin-bottom: 1.5rem; border-radius: 1.1rem; color: #fff; font-weight: 800; font-size: 1.25rem; letter-spacing: -.08em; background: linear-gradient(135deg, #1596e8, #2877df); box-shadow: 0 10px 20px rgba(34, 130, 221, .27); }
      h1 { margin: 0; font-size: clamp(1.65rem, 5vw, 2.15rem); letter-spacing: -.055em; }
      h1 span { color: #168fe1; }
      p { margin: .9rem auto 0; max-width: 25rem; color: #65748a; line-height: 1.55; }
      .status { display: flex; align-items: center; justify-content: center; gap: .65rem; margin-top: 2rem; min-height: 1.5rem; color: #34445d; font-weight: 650; }
      .spinner { width: 1rem; height: 1rem; flex: 0 0 auto; border: 2px solid #c8d4e2; border-top-color: #168fe1; border-radius: 50%; animation: spin .75s linear infinite; }
      .elapsed { margin-top: .4rem; min-height: 1.3rem; color: #8a98aa; font-size: .87rem; }
      a { display: inline-block; margin-top: 1.45rem; padding: .72rem 1rem; border: 1px solid #d4dfeb; border-radius: .75rem; color: #3b516c; font-size: .93rem; font-weight: 650; text-decoration: none; transition: background .15s ease, border-color .15s ease; }
      a:hover { background: #f4f9fd; border-color: #a9cbe7; }
      .ready .spinner { border-color: #bce5d1; border-top-color: #16ae70; animation: none; }
      .ready .status { color: #078b54; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <main id="card">
      <div class="mark" aria-hidden="true">DA</div>
      <h1>Document <span>Analyzer</span></h1>
      <p>L’app si sta avviando. Può richiedere qualche istante dopo un periodo di inattività.</p>
      <div class="status" aria-live="polite"><i class="spinner" aria-hidden="true"></i><span id="status">Connessione al servizio…</span></div>
      <div class="elapsed" id="elapsed"></div>
      <a id="open-now" href="https://cms-azure-app.federicobravetti.it/">Apri subito l’app</a>
    </main>
    <script>
      (() => {
        const APP_URL = "https://cms-azure-app.federicobravetti.it/";
        const HEALTH_URL = new URL("/api/health", APP_URL).href;
        const POLL_INTERVAL_MS = 1800;
        const startedAt = Date.now();
        const card = document.querySelector("#card");
        const status = document.querySelector("#status");
        const elapsed = document.querySelector("#elapsed");
        const link = document.querySelector("#open-now");

        // Preserve a link's query/hash when the landing page is used as its entry point.
        const destination = APP_URL.replace(/\/$/, "") + location.search + location.hash;
        link.href = destination;

        function updateElapsed() {
          const seconds = Math.floor((Date.now() - startedAt) / 1000);
          elapsed.textContent = seconds ? `Attesa: ${seconds} s` : "";
        }

        function openApplication() {
          card.classList.add("ready");
          status.textContent = "Servizio pronto. Apertura dell’app…";
          elapsed.textContent = "";
          window.setTimeout(() => window.location.replace(destination), 350);
        }

        async function probe() {
          try {
            // The API deliberately does not grant cross-origin JSON access. An opaque
            // no-cors response is nevertheless enough to establish that the origin
            // answered, then navigation occurs on the app's own origin.
            await fetch(HEALTH_URL, { mode: "no-cors", cache: "no-store", redirect: "follow" });
            openApplication();
          } catch (_) {
            window.setTimeout(probe, POLL_INTERVAL_MS);
          }
        }

        updateElapsed();
        window.setInterval(updateElapsed, 1000);
        probe();
      })();
    </script>
  </body>
</html>
